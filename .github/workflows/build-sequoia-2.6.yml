name: Build OpenCore Legacy Patcher 2.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS installer packages
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application and installer packages
        run: python Build-Project.command

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Legacy-Patcher-2.6-macOS
          path: |
            dist/OpenCore-Patcher.pkg
            dist/OpenCore-Patcher-Uninstaller.pkg
            dist/AutoPkg-Assets.pkg
            dist/OpenCore-Patcher.app
          if-no-files-found: error
          compression-level: 6
